<text x="974" y="519" font-size="13" font-weight="400" fill="#1f2328">• GPIO35-37: PSRAM octal trên N8R8</text>
<text x="974" y="542" font-size="13" font-weight="400" fill="#1f2328">• GPIO43/44: console (cổng UART)</text>
<text x="974" y="565" font-size="13" font-weight="400" fill="#1f2328">• GPIO0, 3, 45, 46: chân strapping</text>
<text x="974" y="588" font-size="13" font-weight="400" fill="#1f2328">• GPIO19/20: USB gốc</text>
<text x="974" y="611" font-size="13" font-weight="600" fill="#1f2328">Chân analog 1-4 (BATT_VOLT_PIN):</text>
<text x="974" y="634" font-size="13" font-weight="400" fill="#1f2328">  GPIO5, 4, 2, 1 — tối đa 3,1 V</text>
